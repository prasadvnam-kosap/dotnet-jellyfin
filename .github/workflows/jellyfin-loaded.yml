# LOADED capture — dotnet-jellyfin (PROVE plan, phase 0 → 1 gate, added 2026-09-26).
#
# The first .NET APPLICATION cell on real tests. Declared environment copied from ci-tests.yml (its ubuntu
# leg): ubuntu-latest, .NET SDK 10.0.x, `dotnet test Jellyfin.sln --configuration Release`.
# The hook is the product's own DepproofLoaded.dll, copied out of the released Scanner image (unchanged
# since 1.0.0; built for net6.0 — running under .NET 10 is itself a first). The released Scanner reads the
# trace in the same job: the .NET reading path has not changed since 1.0.0.
name: LOADED capture — jellyfin
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to measure. Defaults to the corpus pin.
        required: false
        default: 'depproof-pinned'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: The product's startup hook, from the released Scanner image
        run: |
          mkdir -p hook
          id=$(docker create ghcr.io/depproof/depproof:v1)
          docker cp "$id:/app/recorders/dotnet/DepproofLoaded.dll" hook/
          docker rm "$id" >/dev/null
          ls -la hook
      - name: Tests, traced
        env:
          DOTNET_STARTUP_HOOKS: ${{ github.workspace }}/hook/DepproofLoaded.dll
          DEPPROOF_LOADED_DIR: ${{ github.workspace }}/traces
        run: |
          mkdir -p traces
          dotnet test Jellyfin.sln --configuration Release --verbosity minimal \
            || echo "suite exited $? — a partial suite still yields a valid trace"
      - name: Canary — the hook wrote from a test host
        run: |
          n=$(ls traces/*.loads 2>/dev/null | wc -l)
          t=$(grep -l -i 'testhost' traces/*.loads 2>/dev/null | wc -l)
          echo "$n process traces, $t from a test host"
          [ "$t" -ge 1 ] || { echo "::error::no traced test host"; exit 1; }
      - name: Scan with the released Scanner, reading the trace
        if: always()
        run: |
          mkdir -p sbom
          docker run --rm -v "$PWD:/w" -w /w ghcr.io/depproof/depproof:v1 \
            scan --discover --usage-from traces --fail-on none --output-dir sbom 2>&1 | tee scan.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loaded-jellyfin
          path: |
            traces/
            sbom/
            scan.log
          retention-days: 30
